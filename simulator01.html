<!DOCTYPE html>

<html>
  <head>
    <title>Simulator</title>
    <script type="text/javascript" src="examples/data01.json"></script>
    <script type="text/javascript" src="dist/networksim.min.js"></script>
    <script type="text/javascript">
    function init() 
    {
	NetworkSimulator.initialdata = exampledata;
	var loader = new ImageLoader(
	["img/64/switch.png", 
	    "img/64/router2.png", 
	    "img/64/computer.png", 
	    "img/64/server_web.png", 
	    "img/64/server_dns.png", 
	    "img/64/server_dhcp.png", 
	    "img/64/envelope-DHCP.png", 
	    "img/64/envelope-DNS.png", 
	    "img/64/envelope-HTTP.png",
	    "img/64/envelope-ICMP.png"], 
	simulator
	);
	loader.load();
    }
    </script>
    <meta content="">
    <style>
:root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172033; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-width: 100%; min-height: 100%; background: #eef2f7; font-family: inherit; }
body { overflow: auto; }
#simcontainer { position: relative; float: none !important; width: 2048px !important; height: 1024px !important; margin: 18px; overflow: hidden; border: 1px solid #d7dee8; border-radius: 16px; background: #dfe6ee; box-shadow: 0 12px 36px rgba(15,23,42,.12); }
#simcanvas { display: block; width: 2048px !important; height: 1024px !important; border-radius: 16px; cursor: default; }
.ns-menu { width: 250px; max-width: calc(100vw - 20px); overflow: hidden; border: 1px solid rgba(148,163,184,.38); border-radius: 14px; background: rgba(255,255,255,.97); color: #172033; box-shadow: 0 16px 42px rgba(15,23,42,.22), 0 2px 8px rgba(15,23,42,.10); backdrop-filter: blur(10px); animation: nsMenuIn .12s ease-out; }
.ns-menu-title { padding: 13px 14px 11px; font-size: 13px; font-weight: 700; letter-spacing: .02em; color: #334155; background: #f8fafc; border-bottom: 1px solid #e8edf3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ns-menu-items { padding: 6px; max-height: min(520px, 70vh); overflow-y: auto; }
.ns-menu-item { display: flex; align-items: center; gap: 11px; min-height: 42px; padding: 7px 9px; border-radius: 9px; color: #25324a; text-decoration: none; font-size: 13px; line-height: 1.25; transition: background .12s ease, transform .12s ease; }
.ns-menu-item:hover { background: #eef4ff; color: #0f3f8c; transform: translateX(1px); }
.ns-menu-item img { width: 28px; height: 28px; object-fit: contain; flex: 0 0 28px; }
table { width: 100%; border-collapse: collapse; background: white; }
td, th { border: 1px solid #d8e0ea; padding: 7px 9px; }
fieldset { font-size: .85em; border: 1px solid #d8e0ea; border-radius: 10px; }
input, button, select { font: inherit; }
input[type="button"], button { border: 0; border-radius: 8px; padding: 8px 12px; background: #2563eb; color: white; cursor: pointer; }
@keyframes nsMenuIn { from { opacity: 0; transform: translateY(-4px) scale(.985); } to { opacity: 1; transform: none; } }
</style>
  </head>
  <body onload="init();" >
    <div id="simcontainer" style="float:right;width:2048px; height:1024px;">
      <canvas id="simcanvas" style="width:2048px; height:1024px;" />
    </div>
  </body>
</html>
